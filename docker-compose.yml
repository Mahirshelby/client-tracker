services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clienttracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clienttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clienttracker
      JWT_SECRET: local-dev-secret-change-me-please-0123456789
      PORT: "4000"
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npx tsx src/index.ts"

volumes:
  pgdata:
